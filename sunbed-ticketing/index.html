<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Sunbed Ticketing</title>
<style>
  :root {
    --free: #22c55e;
    --free-dark: #16a34a;
    --occupied: #f97316;
    --occupied-dark: #c2410c;
    --reserved: #eab308;
    --reserved-dark: #a16207;
    --bg: #0b3d5c;
    --panel: #ffffff;
    --ink: #0f2436;
    --muted: #6b7c8a;
    --border: #d8e2ea;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: linear-gradient(180deg, #0b3d5c 0%, #14618f 40%, #eab676 100%);
    color: var(--ink);
    overscroll-behavior: none;
  }
  #app { display: flex; flex-direction: column; min-height: 100vh; }

  header {
    padding: 12px 16px 8px;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    flex-wrap: wrap;
  }
  header h1 { font-size: 1.15rem; margin: 0; font-weight: 700; letter-spacing: 0.2px; }
  header .sub { font-size: 0.78rem; opacity: 0.85; margin-top: 2px; }

  .summary {
    display: flex;
    gap: 8px;
    padding: 0 16px 10px;
    flex-wrap: wrap;
  }
  .chip {
    background: rgba(255,255,255,0.15);
    color: #fff;
    padding: 5px 10px;
    border-radius: 999px;
    font-size: 0.78rem;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 6px;
    backdrop-filter: blur(4px);
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .dot.free { background: var(--free); }
  .dot.occupied { background: var(--occupied); }
  .dot.reserved { background: var(--reserved); }

  #moveBanner {
    display: none;
    margin: 0 16px 10px;
    background: #fef3c7;
    border: 1px solid #f59e0b;
    color: #7c2d12;
    padding: 10px 12px;
    border-radius: 10px;
    font-size: 0.85rem;
    font-weight: 600;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  #moveBanner button {
    background: #7c2d12;
    color: #fff;
    border: none;
    padding: 6px 10px;
    border-radius: 8px;
    font-size: 0.78rem;
    font-weight: 700;
  }

  .grid-wrap {
    flex: 1;
    overflow: auto;
    padding: 4px 12px 24px;
  }
  .beach-label {
    text-align: center;
    color: rgba(255,255,255,0.85);
    font-size: 0.72rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin: 6px 0 10px;
    font-weight: 700;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(10, minmax(0, 1fr));
    gap: 4px;
    max-width: 900px;
    margin: 0 auto;
  }
  @media (min-width: 480px) {
    .grid { gap: 6px; }
  }
  .cell {
    aspect-ratio: 1 / 1;
    border-radius: 10px;
    border: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-weight: 700;
    font-size: 0.78rem;
    line-height: 1.15;
    cursor: pointer;
    background: var(--free);
    box-shadow: 0 2px 0 rgba(0,0,0,0.15), 0 1px 3px rgba(0,0,0,0.25);
    position: relative;
    padding: 2px;
    transition: transform 0.08s ease;
  }
  .cell:active { transform: scale(0.93); }
  .cell.occupied { background: var(--occupied); }
  .cell.reserved { background: var(--reserved); }
  .cell .icon { font-size: 1.1rem; line-height: 1; }
  .cell .label { font-size: 0.68rem; opacity: 0.95; }
  .cell .timer { font-size: 0.62rem; opacity: 0.9; font-weight: 600; }
  .cell.move-target {
    outline: 3px dashed #fff;
    outline-offset: 2px;
    animation: pulse 1s infinite;
  }
  .cell.move-source {
    outline: 3px solid #fff;
    outline-offset: 2px;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.6; }
  }

  /* Modal */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(15, 36, 54, 0.55);
    display: none;
    align-items: flex-end;
    justify-content: center;
    z-index: 20;
  }
  .overlay.open { display: flex; }
  .sheet {
    background: var(--panel);
    width: 100%;
    max-width: 480px;
    border-radius: 18px 18px 0 0;
    padding: 18px 18px calc(18px + env(safe-area-inset-bottom));
    max-height: 88vh;
    overflow-y: auto;
    animation: slideUp 0.18s ease;
  }
  @media (min-width: 560px) {
    .overlay { align-items: center; }
    .sheet { border-radius: 18px; }
  }
  @keyframes slideUp { from { transform: translateY(24px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

  .sheet h2 { margin: 0 0 4px; font-size: 1.05rem; }
  .sheet .sheet-sub { color: var(--muted); font-size: 0.82rem; margin-bottom: 14px; }

  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 0.78rem; font-weight: 700; color: var(--muted); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.4px; }
  .field input, .field textarea, .field select {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 0.95rem;
    font-family: inherit;
    background: #f8fafc;
  }
  .field textarea { resize: vertical; min-height: 54px; }
  .row2 { display: flex; gap: 10px; }
  .row2 .field { flex: 1; }

  .status-toggle { display: flex; gap: 8px; margin-bottom: 14px; }
  .status-toggle button {
    flex: 1;
    padding: 10px 6px;
    border-radius: 10px;
    border: 2px solid var(--border);
    background: #f8fafc;
    font-weight: 700;
    font-size: 0.8rem;
    color: var(--ink);
  }
  .status-toggle button.active[data-status="occupied"] { background: var(--occupied); border-color: var(--occupied-dark); color: #fff; }
  .status-toggle button.active[data-status="reserved"] { background: var(--reserved); border-color: var(--reserved-dark); color: #fff; }

  .btn-row { display: flex; gap: 10px; margin-top: 16px; }
  .btn {
    flex: 1;
    padding: 13px 10px;
    border-radius: 12px;
    border: none;
    font-weight: 700;
    font-size: 0.9rem;
  }
  .btn-primary { background: var(--bg); color: #fff; }
  .btn-secondary { background: #eef2f6; color: var(--ink); }
  .btn-danger { background: #fee2e2; color: #b91c1c; }
  .btn-move { background: #e0f2fe; color: #0369a1; }
  .btn:active { filter: brightness(0.94); }

  .close-x {
    position: absolute;
    top: 14px; right: 14px;
    background: #eef2f6;
    border: none;
    width: 30px; height: 30px;
    border-radius: 50%;
    font-size: 1rem;
    color: var(--muted);
  }
  .sheet { position: relative; }

  .meta-line { display: flex; justify-content: space-between; font-size: 0.85rem; color: var(--muted); padding: 6px 0; border-bottom: 1px solid var(--border); }
  .meta-line:last-of-type { border-bottom: none; }
  .meta-line b { color: var(--ink); }

  footer.toolbar {
    display: flex;
    gap: 8px;
    padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
    background: rgba(255,255,255,0.92);
    backdrop-filter: blur(6px);
    border-top: 1px solid var(--border);
  }
  footer.toolbar button {
    flex: 1;
    padding: 10px 6px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: #fff;
    font-size: 0.78rem;
    font-weight: 700;
    color: var(--ink);
  }
  .toast {
    position: fixed;
    bottom: 74px;
    left: 50%;
    transform: translateX(-50%);
    background: #0f2436;
    color: #fff;
    padding: 9px 16px;
    border-radius: 999px;
    font-size: 0.82rem;
    font-weight: 600;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
    z-index: 40;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; }

  #fileInput { display: none; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div>
      <h1>🏖️ Sunbed Ticketing</h1>
      <div class="sub">6 × 10 grid · tap an umbrella to check in, edit, or check out</div>
    </div>
  </header>

  <div class="summary" id="summary"></div>

  <div id="moveBanner">
    <span>Moving umbrella <b id="moveFromLabel"></b> — tap an empty umbrella to drop it there</span>
    <button id="cancelMove">Cancel</button>
  </div>

  <div class="grid-wrap">
    <div class="beach-label">⬅ Sea side</div>
    <div class="grid" id="grid"></div>
    <div class="beach-label">Boardwalk side ➡</div>
  </div>

  <footer class="toolbar">
    <button id="exportBtn">⬇ Export</button>
    <button id="importBtn">⬆ Import</button>
    <button id="clearAllBtn">🗑 Clear all</button>
  </footer>
</div>

<input type="file" id="fileInput" accept="application/json">

<!-- Check-in / edit sheet -->
<div class="overlay" id="overlay">
  <div class="sheet">
    <button class="close-x" id="closeSheet">✕</button>
    <h2 id="sheetTitle">Umbrella A1</h2>
    <div class="sheet-sub" id="sheetSub">Currently free</div>

    <div id="formView">
      <div class="status-toggle">
        <button type="button" data-status="occupied">🟠 Occupied</button>
        <button type="button" data-status="reserved">🟡 Reserved</button>
      </div>
      <div class="field">
        <label for="guestName">Guest / party name (optional)</label>
        <input type="text" id="guestName" placeholder="e.g. Smith family">
      </div>
      <div class="row2">
        <div class="field">
          <label for="partySize">Party size</label>
          <input type="number" id="partySize" min="1" placeholder="2">
        </div>
        <div class="field">
          <label for="price">Price ($)</label>
          <input type="number" id="price" min="0" step="0.01" placeholder="25">
        </div>
      </div>
      <div class="field">
        <label for="notes">Notes</label>
        <textarea id="notes" placeholder="Umbrella color, allergy note, etc."></textarea>
      </div>
      <div class="btn-row">
        <button class="btn btn-secondary" id="cancelBtn">Cancel</button>
        <button class="btn btn-primary" id="saveBtn">Save</button>
      </div>
    </div>

    <div id="detailView" style="display:none;">
      <div class="meta-line"><span>Status</span><b id="detStatus">—</b></div>
      <div class="meta-line"><span>Guest</span><b id="detGuest">—</b></div>
      <div class="meta-line"><span>Party size</span><b id="detParty">—</b></div>
      <div class="meta-line"><span>Price</span><b id="detPrice">—</b></div>
      <div class="meta-line"><span>Since</span><b id="detSince">—</b></div>
      <div class="meta-line"><span>Duration</span><b id="detDuration">—</b></div>
      <div class="meta-line" id="detNotesRow"><span>Notes</span><b id="detNotes">—</b></div>

      <div class="btn-row">
        <button class="btn btn-secondary" id="editBtn">✏️ Edit</button>
        <button class="btn btn-move" id="moveBtn">↔ Move</button>
      </div>
      <div class="btn-row">
        <button class="btn btn-danger" id="checkoutBtn">Check out (free up)</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  "use strict";

  var ROWS = 6, COLS = 10;
  var STORAGE_KEY = "sunbed-grid-v1";

  function rowLabel(r) { return String.fromCharCode(65 + r); }
  function cellId(r, c) { return rowLabel(r) + (c + 1); }

  function loadState() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    var state = {};
    for (var r = 0; r < ROWS; r++) {
      for (var c = 0; c < COLS; c++) {
        state[cellId(r, c)] = { status: "free" };
      }
    }
    return state;
  }

  var state = loadState();

  function saveState() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  function ensureAllCells() {
    for (var r = 0; r < ROWS; r++) {
      for (var c = 0; c < COLS; c++) {
        var id = cellId(r, c);
        if (!state[id]) state[id] = { status: "free" };
      }
    }
  }
  ensureAllCells();

  var grid = document.getElementById("grid");
  var summary = document.getElementById("summary");
  var overlay = document.getElementById("overlay");
  var sheetTitle = document.getElementById("sheetTitle");
  var sheetSub = document.getElementById("sheetSub");
  var formView = document.getElementById("formView");
  var detailView = document.getElementById("detailView");
  var moveBanner = document.getElementById("moveBanner");
  var moveFromLabel = document.getElementById("moveFromLabel");
  var toastEl = document.getElementById("toast");

  var activeCellId = null;
  var pendingStatus = "occupied";
  var moveSourceId = null;
  var toastTimer = null;

  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove("show"); }, 1800);
  }

  function fmtDuration(ms) {
    var mins = Math.floor(ms / 60000);
    if (mins < 1) return "just now";
    var h = Math.floor(mins / 60);
    var m = mins % 60;
    if (h === 0) return m + "m";
    return h + "h " + m + "m";
  }

  function fmtTime(ts) {
    var d = new Date(ts);
    return d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  }

  function statusIcon(status) {
    if (status === "occupied") return "🧍";
    if (status === "reserved") return "⏳";
    return "⛱️";
  }

  function renderGrid() {
    grid.innerHTML = "";
    var counts = { free: 0, occupied: 0, reserved: 0 };

    for (var r = 0; r < ROWS; r++) {
      for (var c = 0; c < COLS; c++) {
        var id = cellId(r, c);
        var data = state[id];
        counts[data.status] = (counts[data.status] || 0) + 1;

        var btn = document.createElement("button");
        btn.className = "cell " + (data.status !== "free" ? data.status : "");
        btn.dataset.id = id;

        if (moveSourceId === id) btn.classList.add("move-source");
        if (moveSourceId && data.status === "free" && moveSourceId !== id) btn.classList.add("move-target");

        var icon = document.createElement("div");
        icon.className = "icon";
        icon.textContent = statusIcon(data.status);
        btn.appendChild(icon);

        var label = document.createElement("div");
        label.className = "label";
        label.textContent = id;
        btn.appendChild(label);

        if (data.status !== "free" && data.since) {
          var timer = document.createElement("div");
          timer.className = "timer";
          timer.textContent = fmtDuration(Date.now() - data.since);
          btn.appendChild(timer);
        }

        btn.addEventListener("click", onCellClick);
        grid.appendChild(btn);
      }
    }

    summary.innerHTML =
      '<span class="chip"><span class="dot free"></span>' + counts.free + ' free</span>' +
      '<span class="chip"><span class="dot occupied"></span>' + counts.occupied + ' occupied</span>' +
      '<span class="chip"><span class="dot reserved"></span>' + counts.reserved + ' reserved</span>';
  }

  function onCellClick(e) {
    var id = e.currentTarget.dataset.id;
    var data = state[id];

    if (moveSourceId) {
      if (id === moveSourceId) {
        cancelMove();
        return;
      }
      if (data.status !== "free") {
        toast("Umbrella " + id + " is not free");
        return;
      }
      state[id] = state[moveSourceId];
      state[moveSourceId] = { status: "free" };
      saveState();
      toast("Moved to " + id);
      cancelMove();
      renderGrid();
      return;
    }

    openSheet(id);
  }

  function startMove(id) {
    moveSourceId = id;
    moveFromLabel.textContent = id;
    moveBanner.style.display = "flex";
    closeOverlay();
    renderGrid();
  }

  function cancelMove() {
    moveSourceId = null;
    moveBanner.style.display = "none";
    renderGrid();
  }

  document.getElementById("cancelMove").addEventListener("click", cancelMove);

  function openSheet(id) {
    activeCellId = id;
    var data = state[id];
    sheetTitle.textContent = "Umbrella " + id;

    if (data.status === "free") {
      showForm(data);
    } else {
      showDetail(data);
    }
    overlay.classList.add("open");
  }

  function closeOverlay() {
    overlay.classList.remove("open");
    activeCellId = null;
  }

  document.getElementById("closeSheet").addEventListener("click", closeOverlay);
  document.getElementById("cancelBtn").addEventListener("click", closeOverlay);
  overlay.addEventListener("click", function (e) {
    if (e.target === overlay) closeOverlay();
  });

  function showForm(data) {
    formView.style.display = "block";
    detailView.style.display = "none";
    sheetSub.textContent = "Check in this umbrella";

    pendingStatus = data.status === "reserved" ? "reserved" : "occupied";
    document.querySelectorAll(".status-toggle button").forEach(function (b) {
      b.classList.toggle("active", b.dataset.status === pendingStatus);
    });

    document.getElementById("guestName").value = data.guest || "";
    document.getElementById("partySize").value = data.party || "";
    document.getElementById("price").value = data.price || "";
    document.getElementById("notes").value = data.notes || "";
  }

  document.querySelectorAll(".status-toggle button").forEach(function (b) {
    b.addEventListener("click", function () {
      pendingStatus = b.dataset.status;
      document.querySelectorAll(".status-toggle button").forEach(function (x) {
        x.classList.toggle("active", x === b);
      });
    });
  });

  document.getElementById("saveBtn").addEventListener("click", function () {
    if (!activeCellId) return;
    var existing = state[activeCellId];
    var wasFree = !existing || existing.status === "free";
    state[activeCellId] = {
      status: pendingStatus,
      guest: document.getElementById("guestName").value.trim(),
      party: document.getElementById("partySize").value,
      price: document.getElementById("price").value,
      notes: document.getElementById("notes").value.trim(),
      since: wasFree ? Date.now() : (existing.since || Date.now())
    };
    saveState();
    renderGrid();
    closeOverlay();
    toast("Umbrella " + activeCellId + " saved");
  });

  function showDetail(data) {
    formView.style.display = "none";
    detailView.style.display = "block";
    sheetSub.textContent = "Tap Edit to change details";

    document.getElementById("detStatus").textContent = data.status === "occupied" ? "🟠 Occupied" : "🟡 Reserved";
    document.getElementById("detGuest").textContent = data.guest || "—";
    document.getElementById("detParty").textContent = data.party || "—";
    document.getElementById("detPrice").textContent = data.price ? ("$" + data.price) : "—";
    document.getElementById("detSince").textContent = data.since ? fmtTime(data.since) : "—";
    document.getElementById("detDuration").textContent = data.since ? fmtDuration(Date.now() - data.since) : "—";
    document.getElementById("detNotes").textContent = data.notes || "—";
  }

  document.getElementById("editBtn").addEventListener("click", function () {
    showForm(state[activeCellId]);
  });

  document.getElementById("moveBtn").addEventListener("click", function () {
    startMove(activeCellId);
  });

  document.getElementById("checkoutBtn").addEventListener("click", function () {
    if (!activeCellId) return;
    if (!confirm("Check out umbrella " + activeCellId + " and mark it free?")) return;
    state[activeCellId] = { status: "free" };
    saveState();
    renderGrid();
    closeOverlay();
    toast("Umbrella " + activeCellId + " is free");
  });

  document.getElementById("clearAllBtn").addEventListener("click", function () {
    if (!confirm("Clear ALL umbrellas back to free? This cannot be undone.")) return;
    state = {};
    ensureAllCells();
    saveState();
    renderGrid();
    toast("All umbrellas cleared");
  });

  document.getElementById("exportBtn").addEventListener("click", function () {
    var blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    var stamp = new Date().toISOString().slice(0, 16).replace(/[:T]/g, "-");
    a.href = url;
    a.download = "sunbed-grid-" + stamp + ".json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

  var fileInput = document.getElementById("fileInput");
  document.getElementById("importBtn").addEventListener("click", function () {
    fileInput.value = "";
    fileInput.click();
  });
  fileInput.addEventListener("change", function () {
    var file = fileInput.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var imported = JSON.parse(reader.result);
        state = imported;
        ensureAllCells();
        saveState();
        renderGrid();
        toast("Grid imported");
      } catch (e) {
        alert("Could not read that file — is it a valid export from this app?");
      }
    };
    reader.readAsText(file);
  });

  renderGrid();
  setInterval(renderGrid, 30000);
})();
</script>
</body>
</html>
