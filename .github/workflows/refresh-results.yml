name: Refresh Results

# Pulls the latest international results from martj42 (idempotent upsert),
# then refits the model and regenerates predictions so that pre-WC friendlies,
# warm-up matches, and any late results actually reach the engine.
#
# Runs daily at 02:30 UTC — half an hour before the existing 03:00 refit/sim.
#
# NOTE: every step gets the full secret set. The Settings object validates ALL
# required fields on load (even ones a command never uses), so a trimmed env
# block makes the process exit before doing any work.

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:
    inputs:
      years:
        description: "Years of history to (re-)pull"
        required: false
        default: "5"

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -e .

      - name: Pull latest international results
        run: python -m backend.main backfill-martj42 --years ${{ inputs.years || '5' }}

      - name: Refit base ratings on fresh data
        run: python -m backend.main fit

      - name: Regenerate match predictions
        run: python -m backend.main predict
